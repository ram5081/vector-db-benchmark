# Brings up pgvector and Qdrant with matched resource limits, so neither
# system gets an unfair hardware advantage during benchmarking.
# FAISS is not listed here -- it runs in-process inside the harness itself,
# with no server to stand up.
#
# Usage:
#   docker compose up -d
#   docker compose down -v      # tears down AND deletes data, for a clean re-run

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: bench-pgvector
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bench-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
  qdrant_data:
